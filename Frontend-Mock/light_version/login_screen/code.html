<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Garage OS - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af; 
        }
    </style>
</head>
<body class="bg-background-light font-display text-slate-900 min-h-screen flex flex-col overflow-x-hidden">
<header class="w-full flex items-center justify-between border-b border-solid border-slate-200 px-6 py-4 bg-white">
<div class="flex items-center gap-3">
<div class="size-8 text-primary flex items-center justify-center rounded-lg bg-primary/10">
<span class="material-symbols-outlined text-2xl">garage_home</span>
</div>
<h2 class="text-slate-900 text-lg font-bold leading-tight tracking-[-0.015em]">Garage OS</h2>
</div>
<div class="hidden sm:flex gap-4 text-sm font-medium">
<a class="text-slate-500 hover:text-slate-900 transition-colors" href="#">Support</a>
<a class="text-slate-500 hover:text-slate-900 transition-colors" href="#">Contact</a>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4">
<div class="w-full max-w-md">
<div class="bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden">
<div class="px-6 pt-8 pb-6">
<div class="text-center mb-6">
<h1 class="text-2xl font-bold leading-tight tracking-tight mb-2 text-slate-900">Welcome Back</h1>
<p class="text-slate-500 text-sm">Sign in to manage your vehicle or garage.</p>
</div>
<div class="mb-6">
<div class="flex w-full rounded-lg bg-slate-100 p-1">
<label class="cursor-pointer flex-1 text-center">
<input checked="" class="peer sr-only" name="role" type="radio" value="Mechanic"/>
<div class="rounded-md py-2 px-4 text-sm font-medium text-slate-500 transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-sm">
                                Mechanic
                            </div>
</label>
<label class="cursor-pointer flex-1 text-center">
<input class="peer sr-only" name="role" type="radio" value="Customer"/>
<div class="rounded-md py-2 px-4 text-sm font-medium text-slate-500 transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-sm">
                                Customer
                            </div>
</label>
</div>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-medium mb-1.5 text-slate-700">
                            Email Address
                        </label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full rounded-lg border border-slate-300 bg-white px-10 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="user@example.com" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-sm font-medium text-slate-700">
                                Password
                            </label>
<a class="text-sm font-medium text-primary hover:text-primary/80" href="#">
                                Forgot Password?
                            </a>
</div>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full rounded-lg border border-slate-300 bg-white px-10 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full rounded-lg bg-primary py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<div class="bg-slate-50 border-t border-slate-200 px-6 py-4 text-center">
<p class="text-sm text-slate-500">
                    Don't have an account? 
                    <a class="font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
<div class="mt-6 flex justify-center gap-6 text-xs text-slate-400">
<a class="hover:text-slate-600" href="#">Privacy Policy</a>
<a class="hover:text-slate-600" href="#">Terms of Service</a>
</div>
</div>
</main>

</body></html>
